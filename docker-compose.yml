name: kkdugi-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kkdugi_dev
      POSTGRES_USER: kkdugi_dev
      POSTGRES_PASSWORD: kkdugi_dev@2026
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kkdugi-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kkdugi-redis-data:/data
volumes:
  kkdugi-data:
  kkdugi-redis-data:

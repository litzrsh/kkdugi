spring:
  application:
    name: kkdugi-admin
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/kkdugi_dev
    username: kkdugi_dev
    password: kkdugi_dev@2026
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/postgres/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: kkdugi.core.mybatis.CodeEnumTypeHandler

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

kkdugi:
  security:
    password-validity: 30d
    # 개발용 값. 운영 배포 시 환경변수/시크릿 매니저 등으로 반드시 교체한다.
